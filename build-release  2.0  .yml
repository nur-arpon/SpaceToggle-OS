name: Build & Release Installer EXE

# Triggers on:
#   1. git tag push like:  git tag v2.0 && git push origin v2.0
#   2. Manual run from GitHub Actions tab (useful for testing)
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write   # needed to create releases and upload assets

jobs:
  build:
    runs-on: windows-latest

    steps:
      # ── Checkout repo ──────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── Install ps2exe from PowerShell Gallery ─────────────────────────
      - name: Install ps2exe
        shell: pwsh
        run: |
          Install-Module ps2exe -Scope CurrentUser -Force -AllowClobber

      # ── Compile ps1 → exe ──────────────────────────────────────────────
      - name: Build EXE
        shell: pwsh
        run: |
          Invoke-PS2EXE `
            -InputFile  "Install-SpaceToggle.ps1" `
            -OutputFile "Install-SpaceToggle.exe" `
            -Title       "SpaceToggle OS Installer" `
            -Description "One-click installer for SpaceToggle OS" `
            -Company     "nur-arpon" `
            -Version     "2.0.0.0" `
            -NoConsole:$false

      # ── Verify the exe was created ─────────────────────────────────────
      - name: Verify build
        shell: pwsh
        run: |
          if (-not (Test-Path "Install-SpaceToggle.exe")) {
            Write-Error "EXE was not created. Build failed."
            exit 1
          }
          Write-Host "EXE size: $((Get-Item 'Install-SpaceToggle.exe').Length) bytes"

      # ── Create GitHub Release and attach all installer files ───────────
      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: "SpaceToggle OS ${{ github.ref_name }}"
          body: |
            ## SpaceToggle OS ${{ github.ref_name }}

            ### One-step installation — pick your format:

            | File | How to use |
            |------|-----------|
            | **Install-SpaceToggle.exe** | Double-click. Recommended for most users. |
            | **Install-SpaceToggle.bat** | Right-click → Run as administrator (or just double-click). |
            | **Install-SpaceToggle.ps1** | `powershell -ExecutionPolicy Bypass -File Install-SpaceToggle.ps1` |

            All three install to `%USERPROFILE%\SpaceToggle`, set up auto-start, and launch immediately.

            **Hold Space + key to toggle your apps:**
            `B`=Brave · `C`=Chrome · `D`=Discord · `F`=Files · `Q`=Steam
            `S`=Spotify · `V`=VLC/Media · `W`=WhatsApp · `Y`=YouTube · `Z`=Zoom
            and all 26 letters mapped!
          files: |
            Install-SpaceToggle.exe
            Install-SpaceToggle.bat
            Install-SpaceToggle.ps1
            SpaceToggle.ahk
          draft: false
          prerelease: false
